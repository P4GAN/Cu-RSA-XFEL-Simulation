[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xlo-sim-related-notebook"
version = "0.1.0"
description = "Local package wrappers for XLO_sim and mini_ocelot"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pyyaml",
  "h5py"
]

[tool.setuptools]
packages = ["XLO_sim", "mini_ocelot"]
