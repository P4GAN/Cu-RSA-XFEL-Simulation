[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cu-rsa-xfel-sim"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pyyaml",
  "h5py",
  "numba",
  "ocelot-collab"
]

[tool.setuptools]
packages = ["XLO_sim"]
