#units: nm, fs

#photoionization crosssections of Cu

#Cross section of photoionization from ground state to 1s, 2s, 2p_3/2 and other levels
#Original-paper (GRASP/RATIP) values, kept as-is 2026-09-03 -- an XATOM recompute of this base
#cross-section set drifted 10-20% from these (see xatom/recomputed_parameters.json), but GRASP/RATIP
#is trusted more for these than XATOM. XATOM is still used for the satellite_channels/2p_1/2 pathway
#below (no GRASP/RATIP equivalent exists for those).
sigma1_Ka1_2s: 2.45e-7
sigma1_Ka1_2p3: 1.52e-7
sigma1_Ka1_other: 1.2006e-7 # 4.34e-7 - 2.45e-7 - 6.89383e-8

#Total photoionization cross section of 1s, 2s, 2p_3/2, 2p_3/2 3d_5/2 and other levels
#sigma2_Ka1_1s/2p3/2p1 are NOT carved out for the satellite_channels below (theory doc §12.7,
#corrected 2026-09: this file previously subtracted sigma_Ka1_from_2p/1s/2p1 here, which was wrong).
#sigma2_Ka1_* is a total further-photoionization cross section of the already-holed ion; sigma_Ka1_from_*
#(per satellite channel) is a different-class "sudden approximation" spectator-photoabsorption quantity
#(xatom_tools.py's spectator_ionization_cross_section_nm2) -- no verified relationship makes one a
#sub-component of the other's measured total, unlike a genuine branching-ratio split (contrast the
#Gamma_A_2s_eV/GammaA_L1_to_L3M45eVN carve-out below, which IS a verified split of one measurement and
#DOES need the subtraction). The base population already loses the full sigma2_Ka1_* amount regardless
#of whether this sub-process is separately tracked as a satellite feed, so no subtraction is applied.
sigma2_Ka1_1s: 6.53e-7 # original-paper GRASP/RATIP total, not carved out (theory doc §12.7 -- corrected 2026-09)
sigma2_Ka1_2s: 4.05e-7
sigma2_Ka1_2p3: 4.15e-7 # original-paper GRASP/RATIP total, not carved out (theory doc §12.7 -- corrected 2026-09)
sigma2_Ka1_other: 5.0613e-7 # sigma1-weighted avg of remaining "other" subshells' sigma2 (xatom_tools.other_state_parameters)

#2p1/2 (L2, Kalpha2) pathway (docs/theory-and-2s-satellite-pathways.md, Part III, section 20),
#computed via xatom/recompute_all_parameters.py -> xatom_tools.l2_pathway_parameters(). No
#GRASP/RATIP equivalent (this pathway didn't exist in the original paper), so kept as fresh XATOM.
sigma1_Ka1_2p1: 6.89383e-8
#Not carved (theory doc §12.7 -- corrected 2026-09, see sigma2_Ka1_1s/2p3 above).
sigma2_Ka1_2p1: 4.98609e-7


#Chemical composition of the sample
#Cu
compound:
  O:
    N_atoms: 0
    sigma_compound_Ka1: 0

    
#sample concentration in atoms per cubic nm
#solid copper:  84, nitrate 4M solution: 2.509
n: 82.509

#number of atomic levels in the calculation
nlevel: 6

#radiative rates
GammaKeVN: 1.49
GammaL1eVN: 8.13
GammaL2eVN: 1.04
GammaL3eVN: 0.61
GammarKalpha1eVN: 0.39375
GammarKalpha2eVN: 0.202668
# Fully carved out (theory doc §12.7): the 4 satellite_channels below (3d+/3d-/3p+/3p-) now
# explicitly track the entire 2s-hole Auger -> 2p_3/2+spectator (M45+M23) branching via their own
# Gamma_A_2s_eV, replacing rather than adding to this generic feed -- was 5.07 (M45-only estimate,
# pre-satellite-channels), briefly left at a stale 1.57 which double-counted against the satellite
# feed instead of zeroing it out.
GammaA_L1_to_L3M45eVN: 0.0

additional_dephasing: 0

#K alpha atomic transitions photon energy
hwKalpha1N: 8047.91
hwKalpha2N: 8027.98


#simulation domain and padding parameters
tgrid: 2400
zgrid: 15
xgrid: 15
ygrid: 15

tmax: 25.0

zmax: 20.0e+3
xmax: 250.0
ymax: 250.0

xpad: 60
ypad: 60
tpad: 0

auto_grid: False

#seed parameters
seed_pulse_format: 'Ocelot_SASE_seed_pstxy'
E_seed_uJ: 40
seed_duration_FWHM_t: 6.0
t_peak: 10
seed_width_FWHM_x: 180
seed_width_FWHM_y: 220
seed_FEL_bandwidth: 1.5e-3
seed_center_E: 8045

#calculation regime
is_spontaneous_only: False
is_use_stochastic: False
random_seed: -1
enable_noise_mask: True
Esxy_noise_cutoff: 2.0e-3
# run_mode: 'simultaneous', 'consecutive'
run_mode: 'simultaneous'
enable_self_diffraction: True
enable_self_absorption: True
turn_off_coherences: False
enable_kfilter: False
is_Cartesian_pol: True
use_2s_pathway: True
use_L2_pathway: True

