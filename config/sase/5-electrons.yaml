# --- Middlemen ---
# Every atom whose holes the model does not track joins one pool of ions with valence holes only.
# They absorb like neutral atoms; a 2p or 2s hole on them lands in the target satellite blocks.
use_middlemen: true
middlemen:
  targets: {3d+3d+: 0.3333, 3d-3d+: 0.5333, 3d-3d-: 0.1334}
# 2p1/2 -> 2p3/2 + 3d-hole Coster-Kronig, open only in the metal: a branch of GammaL2eVN
L2_CK_feed:
  rate_eV: 0.374
  targets: {3d+: 0.6, 3d-: 0.4}

# --- Free electrons ---
# Photo- and Auger electrons slow down through energy groups from E_top to E_bottom and ionise
# the atoms they pass (Bote-Salvat cross sections).
use_eii: true
eii:
  n_groups: 24
  E_top_eV: 7950
  E_bottom_eV: 16.5
  spatial_factor: 0.5              # share of the ionisations inside the focus
  M_shell_scale: 0.0               # scale of the 3s/3p/3d EII (0 = L shell only)

# --- Pulse ---
pulse: sase                        # SASE pulse from OCELOT
E_seed_uJ: 40                      # pulse energy
seed_center_E: 8045                # SASE centre photon energy (eV)
seed_FEL_bandwidth: 0.0015         # SASE relative bandwidth
seed_duration_FWHM_t: 6.0          # fs
t_peak: 10                         # pulse centre in the time window (fs)
seed_width_FWHM_x: 180             # focal spot (nm)
seed_width_FWHM_y: 220
random_seed: -1                    # -1: new SASE noise every run (sweeps set it per repetition)

# --- Grid (5x5 is the smallest transverse grid to compare with experiment) ---
tgrid: 600
tmax: 25.0                         # time window (fs)
xgrid: 5
xmax: 250.0                        # transverse half-width (nm)
ygrid: 5
ymax: 250.0
zgrid: 30                          # planes through the foil
xpad: 60                           # zero padding for the diffraction FFT
ypad: 60
tpad: 0
