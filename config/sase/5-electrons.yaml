  detuning_eV_L2_split: 21.26
  Gamma_L_eV: 0.572227
  Gamma_K_eV: 1.55265
  Gamma_L2_eV: 0.651793
  sigma_ion_from_2p: 5.04253e-07
  sigma_ion_from_1s: 5.74315e-07
  feed_from:
  - channel: 3p+
    Gamma_feed_eV: 0.6349831403273791
  - channel: 3p-
    Gamma_feed_eV: 0.04626534312315371
  - channel: 3p+
    manifold: upper
    Gamma_feed_eV: 0.7303
  - channel: 3p-
    manifold: upper
    Gamma_feed_eV: 0.0499
  - channel: 3p+
    manifold: L2
    Gamma_feed_eV: 0.635
  - channel: 3p-
    manifold: L2
    Gamma_feed_eV: 0.0463
- name: 3d-3d+
  detuning_eV: -1.69
  detuning_eV_L2_split: 21.26
  Gamma_L_eV: 0.602927
  Gamma_K_eV: 1.55265
  Gamma_L2_eV: 0.609449
  sigma_ion_from_2p: 5.04253e-07
  sigma_ion_from_1s: 5.74315e-07
  feed_from:
  - channel: 3p+
    Gamma_feed_eV: 1.0241386173085028
  - channel: 3p-
    Gamma_feed_eV: 1.6840555508530808
  - channel: 3p+
    manifold: upper
    Gamma_feed_eV: 1.2235
  - channel: 3p-
    manifold: upper
