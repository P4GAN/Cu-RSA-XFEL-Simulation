[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xraymb-sim"
version = "1.0.0"
description = "Maxwell-Bloch simulation of reverse saturable absorption of intense X-ray pulses in copper"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy<2",
  "scipy",
  "matplotlib",
  "pyyaml",
  "h5py",
  "numba",
  "ocelot-collab",
]

[tool.setuptools]
packages = ["xraymb_sim"]
